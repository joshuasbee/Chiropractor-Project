<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Check-In</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">

    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
     
    <!-- <link rel="stylesheet" href="../static/styles.css"> -->

</head>
<body>
    <img src="{{url_for('static', filename='logo.jpeg')}}"/>
    <!-- <img src="../static/logo.jpeg" alt="logo"> -->
      
    <h1>Welcome!</h1>
        <form action="/checkin" method="post">
            <label for="name">Please enter your name:</label>
            <input type="text" id="name" name="name" placeholder="First and last name" autocomplete="off" autofocus required>
            <div class="patient-type">
                <span class="patient-type-title">Are you a new or returning patient?</span>
                <div class="patient-type-options">
                    <input type="radio" id="new_patient" name="patient_type" value="New Patient" required>
                    <label for="new_patient" class="patient-type-label">New Patient</label>

                    <input type="radio" id="returning_patient" name="patient_type" value="Returning Patient" required>
                    <label for="returning_patient" class="patient-type-label">Returning Patient</label>
                </div>
            </div>
            <div style="margin-top: 10px;"></div>
            <button type="submit" class="btn btn-primary btn-lg">Check In</button>
        </form>
{% if checked_in %}
    <div id="checked-in" class="checked-in-overlay">
        <div class="checked-in-check">&#10003;</div>
        <div class="checked-in-text">You are checked in</div>
        <div class="checked-in-sub">Thank you!</div>
        <div class="checked-in-bar"></div>
    </div>
    <script>
        // Remove ?checked_in=1 from the address so a refresh doesn't show the message again
        history.replaceState(null, '', window.location.pathname);
        // Hold the message for 5 seconds, then go back to the blank form
        setTimeout(function () {
            document.getElementById('checked-in').style.display = 'none';
            document.getElementById('name').focus();
        }, 5000);
    </script>
    {% endif %}
</body>
</html>
